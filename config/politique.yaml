# Filtre politique : candidats, partis, émissions toujours politiques et mots-clés.
#
# Ce fichier se modifie depuis GitHub sans toucher au code. Les filtres
# s'appliquent dans cet ordre : liste blanche, puis mots-clés, puis modèle.
#
# La recherche ignore majuscules et accents : « Melenchon » trouve « Mélenchon ».


# TEMPORAIRE (lot 6) : sonde des sites d'annonce d'invités, retirée avant fusion.
name: Sonde temporaire
on:
  push:
    branches: [claude/busy-cerf-497c8s]
    paths: [".github/sonde/**", ".github/workflows/sonde.yml"]
permissions:
  contents: read
jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python .github/sonde/sonde.py
